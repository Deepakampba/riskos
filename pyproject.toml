[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "riskos"
version = "0.1.0"
description = "RiskOS signals + metrics pipeline (PD trend + Exposure-at-Risk)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "pandas",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
riskos = "riskos.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
